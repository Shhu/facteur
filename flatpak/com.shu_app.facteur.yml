# Flatpak of facteur, built offline as Flathub does: the crates (cargo-sources.json) and the
# interface's packages (node-sources.json) are listed sources, regenerated by
# scripts/flatpak-sources.sh whenever Cargo.lock or pnpm-lock.yaml change. scripts/build-flatpak.sh
# builds it from the working tree; scripts/flathub-manifest.sh writes the Flathub copy, which
# takes the release's git tag instead.
id: com.shu_app.facteur
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24
command: facteur
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Passwords and tokens in the system keyring (Secret Service).
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  # "Show backup folder" (tauri-plugin-opener's revealItemInDir asks the file manager over D-Bus).
  - --talk-name=org.freedesktop.FileManager1
  # Downloads, where saved attachments usually go.
  - --filesystem=xdg-download
  # Default backup folder (ui/app/composables/useBackup.ts: Documents/facteur-sauvegardes);
  # without it the backups land on the sandbox's throwaway tmpfs.
  - --filesystem=xdg-documents/facteur-sauvegardes:create
modules:
  - name: facteur
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin
      env:
        CARGO_HOME: /run/build/facteur/cargo
        CARGO_NET_OFFLINE: 'true'
        npm_config_offline: 'true'
        NUXT_TELEMETRY_DISABLED: '1'
    build-commands:
      # The interface, generated here from the listed packages.
      - node pnpm/bin/pnpm.cjs install --offline --frozen-lockfile
      - node pnpm/bin/pnpm.cjs --dir ui generate
      # `tauri/custom-protocol`: what `tauri build` turns on, the interface is served from the binary.
      # Without the local AI for now: llama.cpp needs libclang (the SDK's LLVM extension).
      - cargo build --offline --release --locked -p facteur-app --bin facteur --no-default-features --features tauri/custom-protocol
      - install -Dm755 target/release/facteur ${FLATPAK_DEST}/bin/facteur
      - install -Dm644 flatpak/${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 flatpak/${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 src-tauri/icons/32x32.png ${FLATPAK_DEST}/share/icons/hicolor/32x32/apps/${FLATPAK_ID}.png
      - install -Dm644 src-tauri/icons/64x64.png ${FLATPAK_DEST}/share/icons/hicolor/64x64/apps/${FLATPAK_ID}.png
      - install -Dm644 src-tauri/icons/128x128.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - install -Dm644 src-tauri/icons/128x128@2x.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
    sources:
      # SOURCE: replaced by the release's git tag in the Flathub copy.
      - type: dir
        path: ..
        skip:
          - .git
          - target
          - node_modules
          - ui/node_modules
          - ui/.nuxt
          - ui/.output
          - site
          - src-tauri/gen
      - type: archive
        url: https://registry.npmjs.org/pnpm/-/pnpm-11.1.1.tgz
        sha256: 05b282d06332295c736f0b20c8bdf185325bf1bca682c91ed81154a3c6851cc0
        dest: pnpm
      - cargo-sources.json
      - node-sources.json
